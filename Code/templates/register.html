{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="glass-panel p-10 w-full max-w-md animate__animated animate__fadeIn border-t-2 border-t-purple-500 relative">
        <div class="absolute top-0 left-0 w-2 h-2 bg-purple-500"></div>
        <div class="absolute top-0 right-0 w-2 h-2 bg-purple-500"></div>
        
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white font-tech tracking-widest mb-2">NEW OPERATOR</h2>
            <div class="h-1 w-20 bg-gradient-to-r from-purple-500 to-transparent mx-auto"></div>
        </div>

        <form method="POST" class="space-y-6">
            <div class="group">
                <label class="block text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-2">Assign ID</label>
                <input type="text" name="username" required class="input-tech w-full px-4 py-3 text-lg focus:border-purple-500 focus:shadow-[0_0_15px_rgba(139,92,246,0.2)]" placeholder="New Username">
            </div>
            
            <div class="group">
                <label class="block text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-2">Set Key</label>
                <input type="password" name="password" required class="input-tech w-full px-4 py-3 text-lg focus:border-purple-500 focus:shadow-[0_0_15px_rgba(139,92,246,0.2)]" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-glow w-full bg-purple-600/20 hover:bg-purple-600/40 text-purple-300 border border-purple-500/50 font-bold py-4 uppercase tracking-[0.2em] transition hover:shadow-[0_0_20px_rgba(139,92,246,0.2)]">
                Initialize Account
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <a href="{{ url_for('login') }}" class="text-xs text-gray-500 hover:text-purple-400 uppercase tracking-widest transition">
                [ Return to Login ]
            </a>
        </div>
    </div>
</div>
{% endblock %}
