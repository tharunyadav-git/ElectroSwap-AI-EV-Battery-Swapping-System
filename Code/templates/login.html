{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="glass-panel p-10 w-full max-w-md animate__animated animate__fadeIn border-t-2 border-t-cyan-500 relative">
        <!-- Decorative corner bits -->
        <div class="absolute top-0 left-0 w-2 h-2 bg-cyan-500"></div>
        <div class="absolute top-0 right-0 w-2 h-2 bg-cyan-500"></div>
        <div class="absolute bottom-0 left-0 w-2 h-2 bg-white/20"></div>
        <div class="absolute bottom-0 right-0 w-2 h-2 bg-white/20"></div>

        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white font-tech tracking-widest mb-2">SYSTEM LOGIN</h2>
            <div class="h-1 w-20 bg-gradient-to-r from-cyan-500 to-transparent mx-auto"></div>
        </div>

        <form method="POST" class="space-y-6">
            <div class="group">
                <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2">Identify User</label>
                <input type="text" name="username" required class="input-tech w-full px-4 py-3 text-lg" placeholder="USR-ID">
            </div>
            
            <div class="group">
                <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2">Access Key</label>
                <input type="password" name="password" required class="input-tech w-full px-4 py-3 text-lg" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-glow w-full bg-cyan-600/20 hover:bg-cyan-600/40 text-cyan-300 border border-cyan-500/50 font-bold py-4 uppercase tracking-[0.2em] transition hover:shadow-[0_0_20px_rgba(6,182,212,0.2)]">
                Authenticate
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <a href="{{ url_for('register') }}" class="text-xs text-gray-500 hover:text-cyan-400 uppercase tracking-widest transition">
                [ Request New Access Level ]
            </a>
        </div>
    </div>
</div>
{% endblock %}
